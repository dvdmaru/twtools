<script>
/* ============================================================
   DATA LAYER — Firebase RTDB（複用 taiwan-lottery-535c2，typhoon 同一組）
   路徑（皆在 /twTools_breathe/，不碰 /twTools_typhoon/）：
     - presence：push() 一筆 + onDisconnect().remove()；線上數 = numChildren()
     - messages：push({text, ts:ServerValue.TIMESTAMP})；orderByChild('ts').limitToLast(50)
     - control ：{frozen, notice} → frozen=true 時前端熄燈停收留言
   UI 只依賴 Store 的 onCount / onNotes / getNotes / send / onControl，
   Firebase 不可用時自動 fallback 到 local-only（仍可放空、留言只本機）。
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCDL-vcBH5nRs_FK4iWSqbVPJ7MMNqMmMU",
  authDomain: "taiwan-lottery-535c2.firebaseapp.com",
  databaseURL: "https://taiwan-lottery-535c2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "taiwan-lottery-535c2",
  storageBucket: "taiwan-lottery-535c2.firebasestorage.app",
  messagingSenderId: "953322474907",
  appId: "1:953322474907:web:263c741b993e85e6cc653e"
};
const ROOT = "/twTools_breathe";
const PRUNE_MS = 6*60*60*1000; // 顯示只取最近 50 則，>6h 的機會性刪除

function makeFirebaseStore(){
  if (typeof window==="undefined" || !window.firebase) return null;
  try{
    if(!window.firebase.apps.length) window.firebase.initializeApp(FIREBASE_CONFIG);
    const db = window.firebase.database();
    const SV = window.firebase.database.ServerValue;
    const countCbs=[], noteCbs=[], ctrlCbs=[];
    let notes=[], firstLoaded=false;

    // presence：本頁存在期間佔一格，斷線自動移除
    const myPresence = db.ref(ROOT+"/presence").push();
    db.ref(".info/connected").on("value", snap=>{
      if(snap.val()===true){ myPresence.onDisconnect().remove(); myPresence.set(Date.now()); }
    });
    db.ref(ROOT+"/presence").on("value", snap=>{
      const c = snap.numChildren(); countCbs.forEach(f=>f(c));
    });

    // messages：最近 50 則即時同步
    const mq = db.ref(ROOT+"/messages").orderByChild("ts").limitToLast(50);
    mq.on("value", snap=>{
      const arr=[]; snap.forEach(ch=>{ const v=ch.val()||{}; arr.push({id:ch.key, text:v.text||"", ts:v.ts||Date.now()}); });
      arr.reverse(); // 新→舊
      notes=arr; firstLoaded=true;
      noteCbs.forEach(f=>f(null, notes));
      pruneOld(snap);
    });
    // 新留言飄入（初次載入的 50 則不觸發，只飄真正後到的）
    mq.on("child_added", snap=>{
      if(!firstLoaded) return;
      const v=snap.val()||{}; noteCbs.forEach(f=>f({id:snap.key, text:v.text||"", ts:v.ts||Date.now()}, notes));
    });

    // control：熄燈開關
    db.ref(ROOT+"/control").on("value", snap=>{
      const c = snap.val()||{}; ctrlCbs.forEach(f=>f({frozen: !!c.frozen, notice: c.notice||""}));
    });

    function pruneOld(snap){
      const cut=Date.now()-PRUNE_MS; let n=0;
      snap.forEach(ch=>{ const v=ch.val()||{}; if(typeof v.ts==="number" && v.ts<cut && n<5){ db.ref(ROOT+"/messages/"+ch.key).remove().catch(()=>{}); n++; } });
    }
    return {
      mode:"firebase",
      onCount(cb){ countCbs.push(cb); },
      onNotes(cb){ noteCbs.push(cb); if(firstLoaded) cb(null,notes); },
      onControl(cb){ ctrlCbs.push(cb); },
      getNotes(){ return notes; },
      send(text){ return db.ref(ROOT+"/messages").push({text, ts: SV.TIMESTAMP}); }
    };
  }catch(e){ console.warn("[breathe] Firebase init failed, fallback to local:", e); return null; }
}

function makeLocalStore(){ // CDN 被擋/init 失敗時的降級：仍可放空，留言只本機
  const POOL=["有人也在嗎","放空中…","今天辛苦了","世界安靜了一下","休息一下不是罪","會好的"];
  let notes=["報告寫不完，先放空三分鐘","半夜睡不著的舉手","一起撐，快下班了","深呼吸，沒事的","今天也辛苦了","明天再煩惱明天的事","剛被主管唸，喘口氣","考試週，腦袋需要重開機","想吃宵夜但忍住了","謝謝這個安靜的角落"].map((t,i)=>({id:"l"+i,text:t,ts:Date.now()-(i*47000+9000)}));
  let countCbs=[], noteCbs=[];
  let count=1; // 離線只算自己
  setTimeout(()=>countCbs.forEach(f=>f(count)),0);
  return {
    mode:"local",
    onCount(cb){ countCbs.push(cb); cb(count); },
    onNotes(cb){ noteCbs.push(cb); cb(null,notes); },
    onControl(){},
    getNotes(){ return notes; },
    send(text){ const n={id:Date.now(),text,ts:Date.now()}; notes.unshift(n); notes=notes.slice(0,50); noteCbs.forEach(f=>f(n,notes)); return Promise.resolve(); }
  };
}

const Store = makeFirebaseStore() || makeLocalStore();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function ago(ts){ const s=Math.floor((Date.now()-ts)/1000); if(s<60)return"剛剛"; const m=Math.floor(s/60); if(m<60)return m+" 分前"; return Math.floor(m/60)+" 小時前"; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1900); }

/* ---------- 防濫用（客戶端守則；正式版 + Firebase rules） ---------- */
const BAD=["幹","靠北","白痴","智障","垃圾","fuck","shit"]; // demo 用，正式版擴充
const URL_RE=/(https?:\/\/|www\.|\.com|\.tw|\.net|t\.me|line\.me|@)/i;
let lastSent=0;
function validate(text){
  text=text.trim();
  if(!text) return {ok:false,msg:"先寫點什麼吧"};
  if(text.length>60) return {ok:false,msg:"太長了，60 字以內"};
  if(URL_RE.test(text)) return {ok:false,msg:"這裡不放連結或聯絡方式"};
  if(BAD.some(w=>text.includes(w))) return {ok:false,msg:"換個溫柔點的說法 🙂"};
  if(Date.now()-lastSent<30000) return {ok:false,msg:"歇一下，30 秒後再留一則"};
  return {ok:true,text};
}

/* ---------- ENTRY 渲染 ---------- */
function renderEntryNotes(notes){
  $("#entryNotes").innerHTML = notes.slice(0,5).map(n=>
    `<div class="note"><span class="t">${escapeHtml(n.text)}</span><span class="ago">${ago(n.ts)}</span></div>`).join("");
}
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- 在線數：真實 presence + 不夠時的 ~120 暖場基線（仿 v1） ---------- */
let realCount=0;
let ambient=118+Math.floor(Math.random()*16); // 起始 ~118–133
function shownCount(){ return Math.max(realCount, ambient); }
function paintCount(){ const n=shownCount(); const a=$("#entryCount"), b=$("#liveCount"); if(a)a.textContent=n; if(b)b.textContent=n; }
setInterval(()=>{ ambient += (Math.random()<.5?-1:1)*(Math.random()<.35?2:1); ambient=Math.max(96,Math.min(168,ambient)); paintCount(); }, 4200);
Store.onCount(c=>{ realCount=c; paintCount(); });
paintCount();

Store.onNotes((n,all)=>renderEntryNotes(all));

/* ---------- 放空模式 ---------- */
const breathe=$("#breathe"), orb=$("#orb"), breathText=$("#breathText");
let breatheTimer=null, sessionStart=0, breathPhase=null;
/* 4-7-8 呼吸法：吸氣 4s → 停住 7s → 吐氣 8s */
const PHASES=[
  {label:"吸 氣", scale:"in",   dur:4000},
  {label:"停 住", scale:"hold", dur:7000},
  {label:"吐 氣", scale:"out",  dur:8000}
];
function startBreathe(){
  breathe.classList.add("on"); sessionStart=Date.now();
  document.body.style.overflow="hidden";
  spawnStars(); runBreathLoop(); startTimer(); seedDrift(); startAmbientDrift();
}
function runBreathLoop(){
  let i=0;
  const step=()=>{
    const p=PHASES[i%PHASES.length];
    breathText.textContent=p.label;
    if(p.scale==="in"){ orb.style.transitionDuration="4s"; orb.classList.add("inhale"); }
    else if(p.scale==="out"){ orb.style.transitionDuration="8s"; orb.classList.remove("inhale"); }
    /* hold：維持現狀不縮放 */
    i++; breathPhase=setTimeout(step,p.dur);
  };
  step();
}
function startTimer(){
  const upd=()=>{ const m=Math.floor((Date.now()-sessionStart)/60000); $("#timer").textContent=m; };
  upd(); breatheTimer=setInterval(upd,5000);
}
function stopBreathe(){
  breathe.classList.remove("on"); document.body.style.overflow="";
  clearInterval(breatheTimer); clearTimeout(breathPhase); clearInterval(ambientDriftTimer);
  $("#stars").innerHTML=""; $("#driftzone").innerHTML="";
}
function spawnStars(){
  const box=$("#stars"); box.innerHTML="";
  for(let i=0;i<46;i++){ const s=document.createElement("div"); s.className="star";
    s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
    s.style.animationDuration=(3+Math.random()*5)+"s"; s.style.animationDelay=(Math.random()*5)+"s";
    box.appendChild(s); }
}
/* 飄過的念頭（彈幕，可關閉） */
let danmuOn = localStorage.getItem("breathe_danmu")!=="off";
function drift(text){
  if(!danmuOn) return;
  const z=$("#driftzone"); const d=document.createElement("div"); d.className="drift";
  d.textContent=text; d.style.top=(12+Math.random()*64)+"%";
  d.style.animationDuration=(13+Math.random()*9)+"s";
  z.appendChild(d); setTimeout(()=>d.remove(),24000);
}
/* 暖場灌水彈幕：真實留言少時混入，避免只重複那一兩則（真實留言多了就讓位） */
const FILLER=[
  "今天也辛苦了","一起深呼吸","慢慢來，沒關係","世界安靜了一下","你已經做得很好了",
  "休息也是一種努力","這一刻先不想那些","有人陪著，真好","撐到現在很不容易","喝口水，放鬆肩膀",
  "把煩惱先放門外","謝謝你願意停下來","一切都會過去的","你不是一個人","深夜也有人醒著",
  "給自己三分鐘就好","別對自己太嚴格","風會把累帶走一點","明天的事明天再說","現在只要呼吸就好",
  "肩膀放下來","眼睛閉一下下","這裡很安全","慢慢吐氣","看見情緒，就好",
  "辛苦了，真的","抱抱自己","放空不是浪費","就待著，什麼都不用做","晚點再當大人",
  "讓腦袋放個假","聽著雨，慢慢來","這裡沒有待辦","累了就靠一下","你值得休息一下",
  "再撐一下下就好","靜靜待著也很好","把肩膀的重量放下","明天會更好一點","謝謝你今天的努力"
];
let lastDrift="";
function pickDriftText(){
  const real=Store.getNotes().map(n=>n.text);
  const pool = real.length>=10 ? real : real.concat(FILLER); // 真實留言夠多就純真實，少則灌水補滿
  let t,tries=0; do{ t=pool[Math.floor(Math.random()*pool.length)]; tries++; }while(t===lastDrift && tries<6);
  lastDrift=t; return t;
}
function seedDrift(){ for(let i=0;i<6;i++) setTimeout(()=>drift(pickDriftText()), i*2200); }
/* 讓畫面保持有念頭飄過（即使當下少有新留言）：每 ~6.5s 飄一則（真實+灌水混池） */
let ambientDriftTimer=null;
function startAmbientDrift(){ clearInterval(ambientDriftTimer); ambientDriftTimer=setInterval(()=>{
  if(!danmuOn || !breathe.classList.contains("on")) return;
  drift(pickDriftText());
}, 6500); }
Store.onNotes((n)=>{ if(n && breathe.classList.contains("on")) drift(n.text); });

/* ---------- 送出留言 ---------- */
$("#msgInput").addEventListener("input",e=>$("#msgCount").textContent=`${e.target.value.length} / 60`);
let FROZEN=false, noticeText="";
Store.onControl(c=>{
  FROZEN=c.frozen; noticeText=c.notice;
  const inp=$("#msgInput"), btn=$("#sendBtn");
  if(inp){ inp.disabled=FROZEN; inp.placeholder = FROZEN ? (noticeText||"留言牆暫時休息中…") : "留下一個飄過的念頭…（匿名）"; }
  if(btn) btn.disabled=FROZEN;
});
function send(){
  if(FROZEN){ toast(noticeText||"留言牆暫時休息中"); return; }
  const v=validate($("#msgInput").value);
  if(!v.ok){ toast(v.msg); return; }
  lastSent=Date.now();
  Store.send(v.text).catch(()=>toast("送出失敗，稍後再試")); // realtime echo 會自己把它飄進來，不在此 drift
  $("#msgInput").value=""; $("#msgCount").textContent="0 / 60"; toast("已送出，謝謝你 🤍");
}
$("#sendBtn").addEventListener("click",send);
$("#msgInput").addEventListener("keydown",e=>{ if(e.key==="Enter")send(); });

/* ---------- 環境音 ----------
   AUDIO_SRC 設成 Calm Atlas 的 web 可播放 loop（mp3/ogg public URL）後，
   ♪ 就播你的音樂；留空時退回 WebAudio 合成 pad（零音檔離線 fallback）。 */
const AUDIO_SRC = "/breathe/audio/calm-atlas-rain.mp3"; // Calm Atlas 雨夜 loop（twtools public）
let audioOn=false, actx=null, padNodes=null;
const bgm=$("#bgm");
$("#soundBtn").classList.add("off"); // 音樂預設關，顯示 ✗
$("#soundBtn").addEventListener("click",()=>{
  audioOn=!audioOn; $("#soundBtn").classList.toggle("off",!audioOn);
  if(audioOn){ startAmbient(); } else { stopAmbient(); }
});
function startAmbient(){
  if(AUDIO_SRC){ if(!bgm.src) bgm.src=AUDIO_SRC; bgm.volume=0; bgm.play().then(()=>fadeAudio(bgm,.55,2500)).catch(()=>startPad()); }
  else startPad();
}
function stopAmbient(){
  if(AUDIO_SRC && bgm.src){ fadeAudio(bgm,0,1200,()=>bgm.pause()); }
  else stopPad();
}
function fadeAudio(el,to,ms,done){ const from=el.volume,t0=performance.now();
  (function step(t){ const k=Math.min(1,(t-t0)/ms); el.volume=from+(to-from)*k; if(k<1)requestAnimationFrame(step); else if(done)done(); })(t0);
}
function startPad(){
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==="suspended")actx.resume();
  const out=actx.createGain(); out.gain.value=0; out.connect(actx.destination);
  out.gain.linearRampToValueAtTime(.08, actx.currentTime+3);
  const freqs=[146.83,220,277.18]; // 柔和小三和弦 pad
  const oscs=freqs.map(f=>{ const o=actx.createOscillator(); o.type="sine"; o.frequency.value=f;
    const lfo=actx.createOscillator(); const lg=actx.createGain(); lfo.frequency.value=0.07+Math.random()*0.05; lg.gain.value=3; lfo.connect(lg); lg.connect(o.frequency); lfo.start();
    o.connect(out); o.start(); return o; });
  padNodes={out,oscs};
}
function stopPad(){ if(!padNodes)return; padNodes.out.gain.linearRampToValueAtTime(0,actx.currentTime+1.5); setTimeout(()=>{padNodes.oscs.forEach(o=>o.stop());padNodes=null;},1600); }

/* ---------- 彈幕開關 ---------- */
$("#danmuBtn").classList.toggle("off",!danmuOn);
$("#danmuBtn").addEventListener("click",()=>{
  danmuOn=!danmuOn; localStorage.setItem("breathe_danmu", danmuOn?"on":"off");
  $("#danmuBtn").classList.toggle("off",!danmuOn);
  if(!danmuOn){ $("#driftzone").innerHTML=""; toast("已關閉彈幕"); }
  else { toast("已開啟彈幕"); seedDrift(); }
});

/* ---------- 綁定 ---------- */
$("#startBtn").addEventListener("click",startBreathe);
$("#exitBtn").addEventListener("click",stopBreathe);
$("#aboutLink").addEventListener("click",e=>{e.preventDefault();toast("一個零負擔的線上喘息角落 · prototype");});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&breathe.classList.contains("on"))stopBreathe(); });
</script>
