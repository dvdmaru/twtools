  <rect x="66" y="111" width="150" height="290" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <!-- card 2 -->
  <rect x="296" y="111" width="150" height="290" rx="26" fill="url(#card)"/>
  <line x1="296" y1="256" x2="446" y2="256" stroke="#000" stroke-opacity="0.55" stroke-width="4"/>
  <rect x="296" y="111" width="150" height="290" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
